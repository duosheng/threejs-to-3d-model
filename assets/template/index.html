<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骨骼动画预览</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; --ink: #16181d; --fg: #e8e6e1; --dim: rgba(232, 230, 225, 0.6); --accent: #ffb347; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--fg);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header { position: fixed; top: 18px; left: 22px; pointer-events: none; text-shadow: 0 1px 3px #000; }
    header h1 { margin: 0; font-size: 22px; letter-spacing: 0.12em; }
    header p { margin: 4px 0 0; font-size: 12px; color: var(--dim); letter-spacing: 0.08em; }
    nav { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    nav button { padding: 10px 16px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(20, 22, 27, 0.7);
      color: var(--fg); font: 600 14px/1 inherit; letter-spacing: 0.08em; cursor: pointer; border-radius: 6px; }
    nav button[aria-pressed="true"] { background: var(--accent); color: #1a1208; border-color: var(--accent); }
    .hint { position: fixed; right: 22px; bottom: 28px; font-size: 11px; color: var(--dim); pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <header><h1 id="title"></h1><p id="stats"></p></header>
  <nav id="clips" aria-label="动画"></nav>
  <div class="hint">数字键切换动画 · 拖动旋转 · 滚轮缩放</div>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
